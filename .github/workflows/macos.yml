# macOS binaries for the darwin platform gems: the bundled Railwatch server
# built natively on each macOS architecture from railwatch-rs (pinned below)
# with rust-patches/ applied, ad-hoc signed (Apple Silicon runs nothing
# unsigned), run (version, then setup, serve and /up in a temp dir, and a
# second serve on the same data dir relaying to the first), and packed into
# railwatch-server-<version>-<platform>.gem.
#
# Not a release: no Developer ID signature, no notarization (README,
# "macOS"). Artifacts only.
#
# Hardening as railwatch-rs's release.yml: every action pinned to a full
# commit SHA, checkouts keep no credentials, read-only token.
name: macos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/macos.yml
      - rust-patches/**
      - lib/railwatch/server/version.rb

permissions:
  contents: read

env:
  RAILWATCH_RS_SHA: fc318eda2841c411889f7cf9fcbad9291a578735
  RUST_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: "4"

jobs:
  # The dashboard's frontend is plain files embedded in the binary; build it
  # once, on Linux, as railwatch-rs's release does.
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Rebulk/railwatch-rs
          ref: ${{ env.RAILWATCH_RS_SHA }}
          path: railwatch-rs
          persist-credentials: false
      - name: apply rust-patches
        working-directory: railwatch-rs
        run: git -c user.name=ci -c user.email=ci@localhost am ../rust-patches/*.patch
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - name: brotli
        run: command -v brotli || (sudo apt-get update -qq && sudo apt-get install -y -qq brotli)
      - name: frontend
        working-directory: railwatch-rs
        run: SKIP_CARGO=1 bin/build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: railwatch-rs/frontend/dist/
          include-hidden-files: true
          if-no-files-found: error

  darwin:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-darwin
            runner: macos-14
            arch: arm64
          # macos-13 runners are retired; macos-15-intel is GitHub's x86_64 image.
          - platform: x86_64-darwin
            runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Rebulk/railwatch-rs
          ref: ${{ env.RAILWATCH_RS_SHA }}
          path: railwatch-rs
          persist-credentials: false
      - name: apply rust-patches
        working-directory: railwatch-rs
        run: git -c user.name=ci -c user.email=ci@localhost am ../rust-patches/*.patch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: railwatch-rs/frontend/dist
      - name: toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          sw_vers
          rustc -vV
      - name: build
        working-directory: railwatch-rs
        env:
          # The macOS floor the binary is linked for (the zigbuild cross
          # build used the 11.3 SDK); checked below with vtool.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}/railwatch-rs=. -C strip=symbols"
        run: cargo build --release --locked -p railwatch-server --bin railwatch
      - name: place, ad-hoc sign, inspect
        run: |
          set -euxo pipefail
          mkdir -p "exe/${{ matrix.platform }}"
          cp railwatch-rs/target/release/railwatch "exe/${{ matrix.platform }}/railwatch"
          bin="exe/${{ matrix.platform }}/railwatch"
          # The linker already ad-hoc signs arm64 output; re-sign so both
          # arches carry the same explicit signature.
          codesign --force --sign - "$bin"
          codesign --verify --verbose=2 "$bin"
          codesign --display --verbose=2 "$bin" 2>&1 | grep -E "Signature=adhoc|Identifier"
          file "$bin"
          lipo -archs "$bin" | grep -qx "${{ matrix.arch }}"
          vtool -show-build "$bin" | grep -E "minos|sdk"
          otool -L "$bin"
      - name: run it
        run: |
          set -euxo pipefail
          bin="$PWD/exe/${{ matrix.platform }}/railwatch"
          "$bin" --version
          data=$(mktemp -d)
          export RAILWATCH_DATA_DIR="$data" RAILWATCH_ENV_FILE=/dev/null RAILWATCH_STANDBY_RELAY=true
          printf 'ci-smoke-password-123\n' | "$bin" setup --email ci@example.com --name CI --account Smoke --app Smoke --env production --password-stdin > "$data/setup.out"
          token=$(sed -n 's/.*RAILWATCH_TOKEN=\(rw_[^[:space:]]*\).*/\1/p' "$data/setup.out")
          test -n "$token"
          RAILWATCH_BIND=127.0.0.1:28790 "$bin" serve > "$data/a.log" 2>&1 &
          a=$!
          for i in $(seq 100); do curl -fsS http://127.0.0.1:28790/up > /dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:28790/up
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:28790/ingest/ping
          test -S "$data/serve.sock"
          # A second server on the same data dir, its own port: a standby
          # that relays to the first through serve.sock, then takes over.
          RAILWATCH_BIND=127.0.0.1:28791 "$bin" serve > "$data/b.log" 2>&1 &
          b=$!
          for i in $(seq 100); do curl -fsS http://127.0.0.1:28791/up > /dev/null && break; sleep 0.1; done
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:28791/ingest/ping
          grep -q "standby" "$data/b.log"
          kill -TERM "$a"; wait "$a" || true
          for i in $(seq 100); do grep -q "acquired after" "$data/b.log" && break; sleep 0.1; done
          grep "acquired after" "$data/b.log"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:28791/ingest/ping
          kill -TERM "$b"; wait "$b" || true
          cat "$data/a.log" "$data/b.log"
          rm -rf "$data"
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - name: platform gem
        run: |
          set -euxo pipefail
          mkdir -p pkg
          RAILWATCH_SERVER_PLATFORM=${{ matrix.platform }} gem build railwatch-server.gemspec -o "pkg/railwatch-server-${{ matrix.platform }}.gem"
          gem specification "pkg/railwatch-server-${{ matrix.platform }}.gem" platform
          tar -xOf "pkg/railwatch-server-${{ matrix.platform }}.gem" data.tar.gz | tar -tzv | grep "exe/${{ matrix.platform }}/railwatch"
          # Installed from the gem, the binary keeps its signature and runs.
          gem install --local --ignore-dependencies --install-dir "$RUNNER_TEMP/gems" "pkg/railwatch-server-${{ matrix.platform }}.gem"
          installed=$(ls -d "$RUNNER_TEMP"/gems/gems/railwatch-server-*)/exe/${{ matrix.platform }}/railwatch
          codesign --verify "$installed"
          "$installed" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: railwatch-server-${{ matrix.platform }}
          path: |
            exe/${{ matrix.platform }}/railwatch
            pkg/railwatch-server-${{ matrix.platform }}.gem
          if-no-files-found: error
